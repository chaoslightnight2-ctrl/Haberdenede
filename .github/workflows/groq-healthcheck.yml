name: Validate Groq JSON generation

on:
  pull_request:
    branches: [main]
    paths:
      - "groq_healthcheck.py"
      - "patch_channel_growth.py"
      - "patch_reliability.py"
      - "requirements.txt"
      - ".github/workflows/groq-healthcheck.yml"

permissions:
  contents: read

jobs:
  groq-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install HTTP dependency
        run: python -m pip install requests==2.32.3

      - name: Verify Groq model and JSON mode
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: python groq_healthcheck.py

